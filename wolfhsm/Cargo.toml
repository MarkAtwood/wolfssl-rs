[package]
name = "wolfhsm"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Rust bindings to wolfHSM"
license = "GPL-3.0-only OR LicenseRef-wolfSSL-commercial"
repository = "https://github.com/MarkAtwood/wolfssl-rs"
readme = "README.md"

[features]
## Enable Unix Domain Socket transport.
## Requires a wolfHSM source tree that includes posix_transport_uds.{c,h}
## (upstream wolfHSM main, or a fork with UDS support).
uds = []

## Enable ML-DSA (Dilithium) key support.
## Requires the linked wolfSSL to be built with HAVE_DILITHIUM.
mldsa = []

## Enable certificate management (wh_Client_Cert* API).
cert = []

## Enable authentication and user management (wh_Client_Auth* API).
auth = []

## Enable SHE (Secure Hardware Extension) AutoSAR automotive key management.
## Requires AES, CMAC, WOLFSSL_AES_DIRECT, HAVE_AES_ECB in the linked wolfSSL.
she = ["wolfhsm-sys/she"]

[dependencies]
log = "0.4"
wolfhsm-sys = { version = "0.2.1", path = "../wolfhsm-sys" }
wolfcrypt-sys = { version = "0.2.2", path = "../wolfcrypt-sys" }
signature = "3.0"
p256 = { version = "0.14", features = ["ecdsa"] }
ed25519 = "3.0"
digest = "0.11"
sha2 = "0.11"

[dev-dependencies]
hex-literal = "1"
p256        = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"] }
ed25519-dalek = "3"
x25519-dalek  = { version = "3", features = ["static_secrets"] }
rand        = "0.10"
rsa         = { version = "0.10", features = ["hazmat"] }
