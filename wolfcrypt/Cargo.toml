# NOTE: Most tests for this crate live in the wolfcrypt-conformance
# workspace member.  After making changes here, run:
#   cargo test -p wolfcrypt-conformance

[package]
name = "wolfcrypt"
authors = ["WolfSSL Inc"]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only OR LicenseRef-wolfSSL-commercial"
description = "RustCrypto trait implementations backed by wolfCrypt"
homepage = "http://wolfssl.com"
repository = "https://github.com/MarkAtwood/wolfssl-rs"
readme = "README.md"
keywords = ["wolfcrypt", "wolfssl", "fips", "rustcrypto", "cryptography"]
categories = ["cryptography"]

[features]
default = ["digest", "rand"]
digest   = ["dep:digest_trait", "dep:crypto-common"]
hmac     = ["dep:hmac_trait", "digest"]
cmac     = ["digest"]
hkdf     = ["hmac", "dep:kdf_trait"]
pbkdf2   = ["hmac"]
aead     = ["dep:aead_trait"]
cipher   = ["dep:cipher_trait"]
poly1305 = ["digest"]
signature = ["dep:signature_trait"]
ecdsa    = ["signature"]
ed25519  = ["signature", "dep:ed25519_trait"]
ed448    = ["signature"]
rsa      = ["signature"]
mldsa    = ["signature"]
mlkem    = []
keywrap  = []
dh       = []
des3     = ["dep:cipher_trait"]
ecdh     = []
rand     = ["dep:rand_core"]
blake2   = []
shake    = []
kdf      = []
ecc      = []
lms      = []
rsa-direct = ["rsa", "rand"]
cryptocb = []
hpke     = ["rand"]
fips     = ["wolfcrypt-rs/fips"]
riscv-bare-metal = ["wolfcrypt-rs/riscv-bare-metal"]
cryptocb-only = ["wolfcrypt-rs/cryptocb-only"]
cryptocb-pure = ["wolfcrypt-rs/cryptocb-pure"]
# When enabled, `WolfRng::new()` (which uses INVALID_DEVID / software DRBG) is
# removed from the public API.  Code must use `WolfRng::new_with_dev_id` and
# supply a hardware CryptoCb device ID.  Activating this feature produces a
# compile error at any call site that still uses the software path.
require-dev-id = []

[dependencies]
wolfcrypt-rs = { version = "0.3.0", path = "../wolfcrypt-rs" }

# RustCrypto trait crates (renamed to avoid module name collision), all on
# the 2026 stable generation (crypto-common 0.2 / hybrid-array).
digest_trait    = { package = "digest",         version = "0.11", optional = true, features = ["mac"] }
hmac_trait      = { package = "hmac",           version = "0.13", optional = true }
aead_trait      = { package = "aead",           version = "0.6",  optional = true, features = ["alloc"] }
cipher_trait    = { package = "cipher",         version = "0.5",  optional = true }
signature_trait = { package = "signature",      version = "3.0",  optional = true }
ed25519_trait   = { package = "ed25519",        version = "3.0",  optional = true }
rand_core       = { version = "0.10", optional = true }
kdf_trait       = { package = "kdf",            version = "0.1",  optional = true }
crypto-common   = { version = "0.2",  optional = true }
hybrid-array    = "0.4"
typenum         = "1"
zeroize         = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
hex = "0.4"
hex-literal = "1"
rand_core = "0.10"
aead_trait = { package = "aead", version = "0.6", features = ["alloc"] }
cipher_trait = { package = "cipher", version = "0.5" }
signature_trait = { package = "signature", version = "3.0" }
ed25519_trait = { package = "ed25519", version = "3.0" }
hkdf_trait = { package = "hkdf", version = "0.13" }
hmac_trait = { package = "hmac", version = "0.13" }
pbkdf2_trait = { package = "pbkdf2", version = "0.13" }
digest_trait = { package = "digest", version = "0.11", features = ["mac"] }
