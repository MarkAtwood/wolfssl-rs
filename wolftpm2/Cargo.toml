[package]
name = "wolftpm2"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Unofficial safe Rust bindings to wolfTPM (TPM 2.0); not the official `wolftpm` crate"
license = "GPL-3.0-only OR LicenseRef-wolfSSL-commercial"
repository = "https://github.com/MarkAtwood/wolfssl-rs"
readme = "README.md"

[features]
## Build wolfSSL from source (WOLFSSL_SRC or the bundled submodule) instead of
## using an installed library. Same as wolfcrypt-tls's `vendored` feature.
vendored = ["wolftpm2-sys/vendored"]

## Enable Linux /dev/tpm0 kernel driver transport.
linux-dev = ["wolftpm2-sys/linux-dev"]

## Enable software TPM socket transport (for swtpm / IBM TPM2 simulator).
swtpm = ["wolftpm2-sys/swtpm"]

[dependencies]
wolftpm2-sys = { version = "0.3.1", path = "../wolftpm2-sys" }

[dev-dependencies]
# Independent oracle for sign_verify test: verify TPM-produced ECDSA signatures
# using a pure-Rust P-256 implementation to confirm cross-implementation correctness.
p256 = { version = "0.14", features = ["ecdsa"] }
